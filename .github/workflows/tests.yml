name: PostgreSQL tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'db/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Dockerfile', 'compose.yaml', 'package.json', 'package-lock.json', 'playwright.config.mjs', '.github/workflows/tests.yml']
  pull_request:
    paths: ['src/**', 'db/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Dockerfile', 'compose.yaml', 'package.json', 'package-lock.json', 'playwright.config.mjs', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartplanner_test
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: local_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planner_test -d smartplanner_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SMARTPLANNER_TEST_DATABASE_URL: postgresql://planner_test:local_ci_only@127.0.0.1:5432/smartplanner_test
      SMARTPLANNER_TEST_DB_FLAVOR: native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check browser time conversion
        run: node tests/test_web_time.mjs
      - name: Check browser exports
        run: node tests/test_web_export.mjs
      - name: Check SQLite smoke and persistence
        run: python -m unittest -v tests.test_sqlite_api
      - name: Run contract and native PostgreSQL tests
        run: python scripts/run_tests.py
      - name: Seed restart probe
        run: python scripts/verify_restart.py seed "$RUNNER_TEMP/planner-restart.json"
      - name: Restart disposable PostgreSQL service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker restart "$POSTGRES_CONTAINER"
      - name: Wait for database
        run: python scripts/wait_for_database.py
      - name: Verify account, task, schedule and history after restart
        run: python scripts/verify_restart.py verify "$RUNNER_TEMP/planner-restart.json"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[test]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
