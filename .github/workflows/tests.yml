name: PostgreSQL tests
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'src/**', 'db/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Dockerfile', 'compose.yaml', '.github/workflows/tests.yml']
  pull_request:
    paths: ['frontend/**', 'src/**', 'db/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'Dockerfile', 'compose.yaml', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartplanner_test
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: local_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planner_test -d smartplanner_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SMARTPLANNER_TEST_DATABASE_URL: postgresql://planner_test:local_ci_only@127.0.0.1:5432/smartplanner_test
      SMARTPLANNER_TEST_DB_FLAVOR: native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci --prefix frontend && npm run --prefix frontend build
      - name: Install application and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run contract and native PostgreSQL tests
        run: python scripts/run_tests.py
      - name: Seed restart probe
        run: python scripts/verify_restart.py seed "$RUNNER_TEMP/planner-restart.json"
      - name: Restart disposable PostgreSQL service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker restart "$POSTGRES_CONTAINER"
      - name: Wait for database
        run: python scripts/wait_for_database.py
      - name: Verify account, task, schedule and history after restart
        run: python scripts/verify_restart.py verify "$RUNNER_TEMP/planner-restart.json"

      - name: Install browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run browser tests with real API and PostgreSQL
        env:
          DATABASE_URL: postgresql://planner_test:local_ci_only@127.0.0.1:5432/smartplanner_test
          APP_ORIGIN: http://localhost:8000
          E2E_BASE_URL: http://localhost:8000
          E2E_NATIVE: '1'
        run: |
          python -m uvicorn smartplanner.api:create_app --factory --host 127.0.0.1 --port 8000 --no-access-log > /tmp/planner-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          python -c "import time, urllib.request; [(time.sleep(.5)) for _ in range(4)]; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
          npm run --prefix frontend test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
