[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartplanner-foundation"
version = "0.3.0"
description = "SmartPlanner foundation API with PostgreSQL storage"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "psycopg[binary]==3.3.6",
  "pwdlib[argon2]==0.3.1",
  "uvicorn==0.53.0",
  "email-validator==2.3.0",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
