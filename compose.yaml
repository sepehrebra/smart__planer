name: smartplanner
services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:////app/data/smartplanner.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      APP_ENV: ${APP_ENV:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - planner_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  planner_data:
