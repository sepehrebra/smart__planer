name: smartplanner
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartplanner
      POSTGRES_USER: smartplanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    volumes:
      - planner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartplanner -d smartplanner"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://smartplanner:${POSTGRES_PASSWORD}@db:5432/smartplanner
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8000}
      APP_ENV: ${APP_ENV:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  planner_data:
